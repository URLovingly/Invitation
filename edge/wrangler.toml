name = "urlovingly-invites"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The HTML templates are static assets. The worker runs first for every request and
# fetches templates itself, so the raw templates are never served to the public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# "none" keeps /templates/base.html from being redirected to /templates/base.
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "urlovingly-invites"
# Paste the id printed by: npx wrangler d1 create urlovingly-invites
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional: serve the invites from your own domain.
# [[routes]]
# pattern = "invites.example.com/*"
# zone_name = "example.com"
