<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
.vibrant{min-height:100%;padding:18px;background:#ffefdc;color:#192d39;font-family:Outfit,sans-serif;animation:vibrant-in .75s ease both}.vibrant-card{position:relative;overflow:hidden;padding:23px 19px;background:#fff9ee;border-radius:3px;border:2px solid #192d39;box-shadow:7px 7px 0 #ff5d47}.vibrant-card:before{content:'LOVE';position:absolute;right:-10px;top:14px;font:800 43px Outfit,sans-serif;letter-spacing:2px;color:rgba(255,93,71,.12);transform:rotate(12deg)}.vibrant-chip{position:relative;display:inline-block;padding:5px 9px;background:#c9ed63;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.vibrant h1{position:relative;font:700 37px/1 'Fraunces',serif;margin:18px 0 13px}.vibrant-guest{font-size:11px;font-weight:700;color:#f05145}.vibrant-note{font-size:12px;line-height:1.6;max-width:265px}.vibrant-stamp{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#ffcf42;color:#192d39;font-weight:800;font-size:10px;text-align:center;line-height:1.1;transform:rotate(-10deg);margin:16px 0}.vibrant-details{background:#1c3a49;color:#fff;padding:13px;font-size:11px;line-height:1.8}.vibrant-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.vibrant a{padding:10px 7px;text-align:center;text-decoration:none;background:#ff5d47;color:#fff;font-size:10px;font-weight:700}.vibrant a:first-child{grid-column:span 2;background:#c9ed63;color:#192d39}@keyframes vibrant-in{from{opacity:0;transform:translateY(15px) rotate(-1deg)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.vibrant{animation:none}}
</style>
<section class="vibrant"><article class="vibrant-card"><span class="vibrant-chip">Big day · Big love</span><div class="vibrant-guest">A note for {{guest_name}}</div><h1>{{couple_names}}</h1><p class="vibrant-note">{{custom_note}}</p>{{photo_gallery}}<div class="vibrant-stamp">SAVE<br>THE<br>DATE</div><div class="vibrant-details"><div class="invite-event-date"><strong class="invite-date-scratch">{{wedding_date}}</strong><span class="invite-time">{{wedding_time}}</span><div class="invite-countdown" hidden role="timer" aria-label="Countdown to the wedding"></div></div><br>{{venue}}</div><div class="vibrant-actions">{{map_embed}}<a href="{{wa_url}}" target="_blank" rel="noopener">WhatsApp RSVP</a><a href="{{email_url}}">Email RSVP</a></div></article></section>
