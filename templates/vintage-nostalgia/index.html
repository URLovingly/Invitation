<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
.vintage{min-height:100%;padding:20px;background:#e8dcc4;color:#42352d;font-family:'Special Elite',serif;animation:vintage-in .8s ease both}.vintage-card{position:relative;padding:25px 18px;background:#f7f0e2;border:1px solid #aa9473;box-shadow:3px 5px 0 rgba(80,58,38,.13);text-align:center;transform:rotate(-.4deg)}.vintage-card:before{content:'';position:absolute;inset:7px;border:1px dashed #b9a687;pointer-events:none}.vintage-postmark{position:absolute;right:17px;top:16px;width:42px;height:42px;border:1px solid #a77d67;border-radius:50%;display:grid;place-items:center;color:#9a705f;font-size:8px;line-height:1.1;transform:rotate(12deg)}.vintage-kicker{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#947558}.vintage h1{font:500 32px/1.08 'Playfair Display',serif;color:#574338;margin:17px 0}.vintage-guest{font:italic 15px 'Playfair Display',serif}.vintage-note{font:italic 12px/1.7 'Playfair Display',serif;margin:13px 0;color:#756353}.vintage-rule{margin:16px auto;width:72%;border-top:1px solid #c1af91}.vintage-details{font-size:10px;line-height:1.9}.vintage-actions{display:grid;gap:7px;margin-top:17px}.vintage a{padding:10px;text-decoration:none;background:#80664e;color:#fff8e8;font-size:9px;letter-spacing:.8px;text-transform:uppercase}.vintage a:not(:first-child){background:transparent;border:1px solid #9c8266;color:#66513e}@keyframes vintage-in{from{opacity:0;transform:translateY(12px) rotate(-1.5deg)}to{opacity:1;transform:rotate(-.4deg)}}@media(prefers-reduced-motion:reduce){.vintage{animation:none}}
</style>
<section class="vintage"><article class="vintage-card"><div class="vintage-postmark">EST.<br>WITH LOVE</div><div class="vintage-kicker">A keepsake invitation</div><div class="vintage-rule"></div><div class="vintage-kicker">Dear {{guest_name}}</div><h1>{{couple_names}}</h1><p class="vintage-note">“{{custom_note}}”</p><div class="vintage-rule"></div><div class="vintage-details">Join us on<br><strong>{{wedding_date}}</strong> · {{wedding_time}}<br><br>{{venue}}</div><div class="vintage-actions"><a href="{{map_url}}" target="_blank" rel="noopener">Find the venue</a><a href="{{wa_url}}" target="_blank" rel="noopener">Send RSVP · WhatsApp</a><a href="{{email_url}}">Send RSVP · Email</a></div></article></section>
