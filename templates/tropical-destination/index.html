<style>
@import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=DM+Serif+Display&display=swap');
.tropical{min-height:100%;padding:19px;background:linear-gradient(160deg,#dbf0e6,#eaf5ed 46%,#f5ead2);color:#173d3b;font-family:Karla,sans-serif;animation:tropical-in .8s ease both}.tropical-card{position:relative;overflow:hidden;padding:24px 18px;background:#fffdf5;border-radius:46% 46% 4px 4px/11% 11% 4px 4px;border:1px solid #9bb9a5;text-align:center}.tropical-sun{width:68px;height:68px;background:#f2c76b;border-radius:50%;margin:0 auto 14px;box-shadow:0 0 0 9px rgba(242,199,107,.15);animation:tropical-sun 5s ease-in-out infinite}.tropical-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#418076}.tropical h1{font:34px/1.08 'DM Serif Display',serif;color:#185a53;margin:13px 0}.tropical-guest{font-size:11px;font-weight:700}.tropical-note{font:italic 13px/1.6 'DM Serif Display',serif;color:#55746b;margin:14px 0}.tropical-line{height:1px;background:linear-gradient(90deg,transparent,#85aa93,transparent);margin:15px}.tropical-details{font-size:11px;line-height:1.85}.tropical-actions{display:grid;gap:8px;margin-top:17px}.tropical a{padding:10px;text-decoration:none;color:#fff;background:#187269;border-radius:22px;font-size:10px;font-weight:700}.tropical a:not(:first-child){background:transparent;border:1px solid #508d7b;color:#235e57}@keyframes tropical-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes tropical-sun{50%{transform:translateY(-4px);box-shadow:0 0 0 13px rgba(242,199,107,.12)}}@media(prefers-reduced-motion:reduce){.tropical,.tropical-sun{animation:none}}
</style>
<section class="tropical"><article class="tropical-card"><div class="tropical-sun"></div><div class="tropical-label">A little getaway · A lifetime together</div><h1>{{couple_names}}</h1><div class="tropical-guest">Dear {{guest_name}}</div><p class="tropical-note">“{{custom_note}}”</p>{{photo_gallery}}<div class="tropical-line"></div><div class="tropical-details"><div class="invite-event-date"><strong class="invite-date-scratch">{{wedding_date}}</strong><span class="invite-time">{{wedding_time}}</span><div class="invite-countdown" hidden role="timer" aria-label="Countdown to the wedding"></div></div><br>{{venue}}</div><div class="tropical-actions">{{map_embed}}<a href="{{wa_url}}" target="_blank" rel="noopener">RSVP on WhatsApp</a><a href="{{email_url}}">RSVP by email</a></div></article></section>
