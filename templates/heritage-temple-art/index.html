<style>
@import url('https://fonts.googleapis.com/css2?family=Yeseva+One&family=Hind+Madurai:wght@400;500;600&display=swap');
.heritage{--saffron:#b35b2f;min-height:100%;padding:19px;background:#f3e3c5;color:#3e2b20;font-family:'Hind Madurai',sans-serif;animation:heritage-in .9s ease both}.heritage-card{position:relative;padding:24px 18px;text-align:center;background:#fbf3df;border:1px solid #bb7a48;box-shadow:inset 0 0 0 5px #f3e3c5,inset 0 0 0 6px #c58a58}.heritage-ornament{font-size:20px;color:#a24a2b;letter-spacing:8px}.heritage-kicker{margin-top:8px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#985034}.heritage h1{font:30px/1.15 'Yeseva One',serif;color:#853e2d;margin:15px 0}.heritage-guest{font:18px 'Yeseva One',serif}.heritage-note{font:13px/1.7 'Hind Madurai',sans-serif;margin:13px 0;color:#67503b}.heritage-divider{margin:16px auto;width:70%;height:1px;background:linear-gradient(90deg,transparent,#b67645,transparent)}.heritage-details{font-size:11px;line-height:1.9}.heritage-actions{display:grid;gap:8px;margin-top:17px}.heritage a{padding:10px;text-decoration:none;background:#8f492f;color:#fff8e8;font-size:10px;letter-spacing:.5px}.heritage a:not(:first-child){background:transparent;border:1px solid #a76443;color:#71402d}@keyframes heritage-in{from{opacity:0;clip-path:inset(0 0 100%)}to{opacity:1;clip-path:inset(0)}}@media(prefers-reduced-motion:reduce){.heritage{animation:none}}
</style>
<section class="heritage"><article class="heritage-card"><div class="heritage-ornament">❧ ❈ ❧</div><div class="heritage-kicker">With blessings from our families</div><h1>{{couple_names}}</h1><div class="heritage-divider"></div><div class="heritage-kicker">An invitation for</div><div class="heritage-guest">{{guest_name}}</div><p class="heritage-note">“{{custom_note}}”</p>{{photo_gallery}}<div class="heritage-ornament">✦</div><div class="heritage-details"><div class="invite-event-date"><strong class="invite-date-scratch">{{wedding_date}}</strong><span class="invite-time">{{wedding_time}}</span><div class="invite-countdown" hidden role="timer" aria-label="Countdown to the wedding"></div></div><br>{{venue}}</div><div class="heritage-divider"></div><div class="heritage-actions">{{map_embed}}<a href="{{wa_url}}" target="_blank" rel="noopener">Send your blessings & RSVP</a><a href="{{email_url}}">Reply by email</a></div></article></section>
