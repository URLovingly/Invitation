<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap');
.royal{min-height:100%;padding:22px;background:radial-gradient(ellipse at 50% 0,#57336c,#21162f 63%);color:#fff7e8;font-family:Manrope,sans-serif;animation:royal-rise .8s cubic-bezier(.2,.75,.25,1) both}.royal-card{padding:23px 18px;text-align:center;border:1px solid #c7a75b;outline:1px solid #80663d;outline-offset:-6px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015));position:relative;overflow:hidden}.royal-card:before{content:'';position:absolute;inset:-50% 30% 55%;background:#c7a75b;opacity:.1;filter:blur(35px);transform:rotate(25deg)}.royal-crown{color:#d5b86c;font-size:24px;animation:royal-crown 2.8s ease-in-out infinite}.royal-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#dfc77e}.royal h1{position:relative;font:500 35px/1.06 'Playfair Display',serif;color:#f1d98c;margin:16px 0}.royal-guest{font:17px 'Playfair Display',serif;margin:17px 0 10px}.royal-note{font:italic 12px/1.7 'Playfair Display',serif;color:#e6d9ee}.royal-seal{width:54px;height:54px;border:1px solid #c7a75b;border-radius:50%;display:grid;place-items:center;margin:18px auto 12px;color:#e0c778;font-size:18px}.royal-details{border-top:1px solid #8e7447;border-bottom:1px solid #8e7447;padding:12px 5px;font-size:11px;line-height:1.8;color:#f7ecd7}.royal-actions{display:grid;gap:8px;margin-top:16px}.royal a{padding:11px;text-decoration:none;background:#c3a45a;color:#251a2d;font-size:10px;font-weight:700;letter-spacing:.7px}.royal a:not(:first-child){background:transparent;color:#f7e6bd;border:1px solid #94794b}@keyframes royal-rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}@keyframes royal-crown{50%{transform:translateY(-4px);text-shadow:0 0 16px #e7c66b}}@media(prefers-reduced-motion:reduce){.royal,.royal-crown{animation:none}}
</style>
<section class="royal"><article class="royal-card"><div class="royal-crown">♛</div><div class="royal-label">By royal invitation</div><h1>{{couple_names}}</h1><div class="royal-label">Request the pleasure of your company</div><div class="royal-guest">{{guest_name}}</div><p class="royal-note">“{{custom_note}}”</p><div class="royal-seal">✦</div><div class="royal-details"><strong>{{wedding_date}}</strong><br>{{wedding_time}}<br>{{venue}}</div><div class="royal-actions"><a href="{{map_url}}" target="_blank" rel="noopener">Ceremony location</a><a href="{{wa_url}}" target="_blank" rel="noopener">RSVP on WhatsApp</a><a href="{{email_url}}">RSVP by email</a></div></article></section>
