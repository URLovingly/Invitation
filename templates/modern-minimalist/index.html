<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');
.minimal{min-height:100%;padding:22px;background:#f7f7f3;color:#202823;font-family:'DM Sans',sans-serif;animation:minimal-in .7s ease both}.minimal-card{background:#fff;padding:24px 20px;border:1px solid #e4e8e1}.minimal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6e8e3;padding-bottom:12px;color:#607167;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}.minimal-mark{width:28px;height:28px;border:1px solid #9eae9f;border-radius:50%;display:grid;place-items:center;font:16px 'DM Serif Display',serif;color:#607167}.minimal h1{font:36px/1.03 'DM Serif Display',serif;letter-spacing:0;margin:24px 0 14px;color:#28382e}.minimal-guest{font-size:11px;color:#6d786f}.minimal-note{font:italic 13px/1.7 'DM Sans',sans-serif;color:#67716a;margin:16px 0 22px}.minimal-info{border-left:2px solid #94a991;padding-left:12px;font-size:11px;line-height:1.9}.minimal-label{display:block;color:#788579;font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-top:10px}.minimal-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}.minimal a{flex:1;text-align:center;padding:11px 7px;text-decoration:none;border:1px solid #728476;color:#35483b;font-size:10px;min-width:85px}.minimal a:first-child{background:#35483b;color:#fff}@keyframes minimal-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.minimal{animation:none}}
</style>
<section class="minimal"><article class="minimal-card"><div class="minimal-top"><span>Invitation / 01</span><span class="minimal-mark">&</span></div><div class="minimal-guest">Prepared for {{guest_name}}</div><h1>{{couple_names}}</h1><p class="minimal-note">{{custom_note}}</p><div class="minimal-info"><span class="minimal-label">Date & time</span>{{wedding_date}} · {{wedding_time}}<span class="minimal-label">Place</span>{{venue}}</div><div class="minimal-actions"><a href="{{map_url}}" target="_blank" rel="noopener">Map</a><a href="{{wa_url}}" target="_blank" rel="noopener">WhatsApp RSVP</a><a href="{{email_url}}">Email RSVP</a></div></article></section>
