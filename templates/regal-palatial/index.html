<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');
.regal{--ink:#282018;--gold:#b18a48;--paper:#f8f1e3;min-height:100%;padding:24px;background:#30251e;color:var(--ink);font-family:Montserrat,serif;animation:regal-in .9s ease both}.regal-card{position:relative;padding:28px 21px;text-align:center;background:var(--paper);border:1px solid var(--gold);outline:1px solid rgba(177,138,72,.6);outline-offset:-7px;box-shadow:0 18px 45px #100b08}.regal-card:before,.regal-card:after{content:'✦';position:absolute;color:var(--gold);font-size:19px;animation:regal-glint 3s ease-in-out infinite}.regal-card:before{top:14px;left:16px}.regal-card:after{right:16px;bottom:14px}.regal-kicker{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}.regal h1{font:600 37px/1.02 'Cormorant Garamond',serif;margin:15px 0;color:#392818}.regal-guest{margin:20px 0 16px;font:500 23px 'Cormorant Garamond',serif}.regal-note{font:italic 14px/1.65 'Cormorant Garamond',serif;color:#695844}.regal-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0}.regal-details{font:11px/1.8 Montserrat,sans-serif;letter-spacing:.4px}.regal-actions{display:grid;gap:8px;margin-top:20px}.regal a{display:block;padding:11px;text-decoration:none;color:#fff;background:#493622;font-size:10px;letter-spacing:1px;text-transform:uppercase}.regal a:first-child{background:#a58143}.regal-footer{margin-top:19px;font-size:9px;letter-spacing:2px;color:#927344;text-transform:uppercase}@keyframes regal-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes regal-glint{50%{opacity:.35;transform:rotate(45deg) scale(.8)}}@media(prefers-reduced-motion:reduce){.regal,.regal-card:before,.regal-card:after{animation:none}}
</style>
<section class="regal"><article class="regal-card"><div class="regal-kicker">A celebration of love</div><div class="regal-rule"></div><div class="regal-kicker">The honor of your presence is requested</div><h1>{{couple_names}}</h1><div class="regal-kicker">Together with their families</div><div class="regal-guest">For {{guest_name}}</div><p class="regal-note">“{{custom_note}}”</p><div class="regal-rule"></div><div class="regal-details"><strong>{{wedding_date}}</strong><br>{{wedding_time}}<br><br>{{venue}}</div><div class="regal-actions"><a href="{{map_url}}" target="_blank" rel="noopener">View the venue</a><a href="{{wa_url}}" target="_blank" rel="noopener">Kindly reply on WhatsApp</a><a href="{{email_url}}">Reply by email</a></div><div class="regal-footer">With love · URLovingly</div></article></section>
