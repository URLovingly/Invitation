name: URLovingly Builder

on:
  repository_dispatch:
    types: [generate_invite]

permissions:
  contents: write

jobs:
  generate-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r req.txt

      - name: Execute Python Generator
        env:
          GUEST_NAME: ${{ github.event.client_payload.data.name }}
          COUPLE_NAMES: ${{ github.event.client_payload.data.couple_names }}
          RENDERED_HTML: ${{ github.event.client_payload.data.rendered_html }}
        run: python generate.py

      - name: Commit and Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all newly generated files and folders
          git add .
          git commit -m "URLovingly: Generated invite for ${{ github.event.client_payload.data.name }}" || echo "No changes to commit"
          
          git pull --rebase origin main || true
          git push