name: URLovingly Builder

on:
  repository_dispatch:
    types: [generate_invite]

permissions:
  contents: write

jobs:
  generate-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r req.txt

      - name: Execute Python Generator
        env:
          # Added '.data.' to target the nested payload structure
          GUEST_NAME: ${{ github.event.client_payload.data.name }}
          TEMPLATE: ${{ github.event.client_payload.data.template }}
          COUPLE_NAMES: ${{ github.event.client_payload.data.couple_names }}
          WEDDING_DATE: ${{ github.event.client_payload.data.wedding_date }}
          WEDDING_TIME: ${{ github.event.client_payload.data.wedding_time }}
          VENUE: ${{ github.event.client_payload.data.venue }}
          MAP_URL: ${{ github.event.client_payload.data.map_url }}
          RSVP_PHONE: ${{ github.event.client_payload.data.rsvp_phone }}
          HOST_EMAIL: ${{ github.event.client_payload.data.host_email }}
          CUSTOM_NOTE: ${{ github.event.client_payload.data.custom_note }}
        run: python generate.py

      - name: Commit and Push to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add to/
          git commit -m "URLovingly: Generated invite for ${{ github.event.client_payload.data.name }}" || echo "No changes to commit"
          git push