<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Owner dashboard | URLovingly</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background: #f6f7f8; color: #20292b; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { position: relative; background: #173d3b; color: white; padding: 22px max(20px, calc((100vw - 1180px) / 2)); }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; color: #d2e5df; font-size: 13px; }
    #signout { position: absolute; top: 22px; right: max(20px, calc((100vw - 1180px) / 2)); padding: 7px 10px; border: 1px solid #d2e5df; border-radius: 4px; background: transparent; color: white; cursor: pointer; }
    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 56px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    #summary { display: flex; flex-wrap: wrap; gap: 18px; margin: 0; color: #425352; font-size: 13px; }
    #summary strong { color: #173d3b; }
    input { width: min(340px, 100%); padding: 10px 12px; border: 1px solid #cbd4d2; border-radius: 4px; background: white; font: inherit; }
    #status { min-height: 20px; margin: 12px 0; color: #52605e; font-size: 13px; }
    .customer { padding: 18px 0 22px; border-top: 1px solid #d9dfdd; }
    .customer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px 14px; }
    .customer h2 { margin: 0; font-size: 17px; }
    .muted { color: #697674; font-size: 12px; }
    .event { margin-top: 14px; padding: 14px 16px; border-left: 3px solid #7da49b; background: #fff; }
    .event-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
    .event h3 { margin: 0; font-size: 15px; }
    .event-meta { margin: 5px 0 12px; color: #65716f; font-size: 12px; }
    .storage { margin: 10px 0; color: #3e504d; font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { color: #667371; text-align: left; font-weight: 600; }
    th, td { padding: 8px 10px 8px 0; border-top: 1px solid #edf0ef; vertical-align: top; }
    a { color: #11655b; overflow-wrap: anywhere; }
    .empty { padding: 22px 0; color: #65716f; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) { header { padding: 18px 16px; } main { width: calc(100% - 24px); margin-top: 16px; } .event { padding: 12px; } }
  </style>
</head>
<body>
  <header>
    <h1>URLovingly owner dashboard</h1>
    <p>Private customer, invitation-link and stored-asset overview</p>
    <button id="signout" type="button">Sign out</button>
  </header>
  <main>
    <div class="toolbar">
      <dl id="summary" aria-label="Account totals"></dl>
      <label><span class="sr-only">Search customers</span><input id="search" type="search" placeholder="Filter by customer, email or event"></label>
    </div>
    <p id="status" role="status" aria-live="polite">Loading account data…</p>
    <div id="customers"></div>
  </main>
  <script>
    const status = document.getElementById('status');
    const root = document.getElementById('customers');
    const search = document.getElementById('search');
    let customers = [];

    function node(tag, value, className) {
      const element = document.createElement(tag);
      if (value !== undefined && value !== null) element.textContent = value;
      if (className) element.className = className;
      return element;
    }

    function formatBytes(value) {
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${(value / (1024 * 1024)).toFixed(2)} MB`;
    }

    function date(value) {
      return value ? new Date(value).toLocaleString() : '—';
    }

    function linkCell(row, href, label) {
      const cell = document.createElement('td');
      const anchor = node('a', label);
      anchor.href = href;
      anchor.rel = 'noopener noreferrer';
      anchor.target = '_blank';
      cell.append(anchor);
      row.append(cell);
    }

    function renderSummary(summary) {
      const values = [
        ['Customers', summary.customer_count], ['Events', summary.event_count],
        ['Guest links', summary.link_count], ['Stored data', formatBytes(summary.stored_bytes)]
      ];
      const list = document.getElementById('summary');
      list.replaceChildren();
      for (const [label, value] of values) {
        const item = node('div');
        item.append(node('dt', label), node('dd', value, 'summary-value'));
        item.querySelector('dt').style.display = 'inline';
        item.querySelector('dd').style.display = 'inline';
        item.querySelector('dd').style.margin = '0 0 0 4px';
        item.querySelector('dd').style.fontWeight = '700';
        list.append(item);
      }
    }

    function renderEvent(event) {
      const section = node('section', undefined, 'event');
      const heading = node('div', undefined, 'event-head');
      heading.append(node('h3', event.title), node('span', `${event.plan_name} · ${event.status}${event.is_trial ? ' · trial' : ''}`, 'muted'));
      section.append(heading, node('p', `Created ${date(event.created_at)} · ${event.links.length} links`, 'event-meta'));
      section.append(node('p', `Invitation pages stored in database: ${formatBytes(event.stored_html_bytes)} · ${event.embedded_photo_count} embedded photos`, 'storage'));

      if (event.links.length) {
        const wrapper = node('div', undefined, 'table-wrap');
        const table = node('table');
        const head = document.createElement('thead');
        const headerRow = document.createElement('tr');
        for (const label of ['Guest', 'Invitation link', 'Design', 'Hosted until', 'Page size']) headerRow.append(node('th', label));
        head.append(headerRow);
        const body = document.createElement('tbody');
        for (const invite of event.links) {
          const row = document.createElement('tr');
          row.append(node('td', invite.guest_name));
          linkCell(row, invite.url, invite.url);
          row.append(node('td', invite.template), node('td', date(invite.expires_at)), node('td', formatBytes(invite.stored_html_bytes)));
          body.append(row);
        }
        table.append(head, body);
        wrapper.append(table);
        section.append(wrapper);
      }

      if (event.assets.length) {
        section.append(node('p', 'Stored files', 'storage'));
        for (const asset of event.assets) {
          const line = node('p', `${asset.kind}: ${asset.name} · ${asset.content_type} · ${asset.size_bytes === null ? 'file missing' : formatBytes(asset.size_bytes)}`, 'event-meta');
          if (asset.available) {
            line.append(document.createTextNode(' · '));
            const anchor = node('a', 'open asset');
            anchor.href = asset.url;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            line.append(anchor);
          }
          section.append(line);
        }
      }
      return section;
    }

    function renderCustomers() {
      const query = search.value.trim().toLowerCase();
      root.replaceChildren();
      const matches = customers.filter(customer =>
        `${customer.name} ${customer.email} ${customer.events.map(event => event.title).join(' ')}`.toLowerCase().includes(query)
      );
      status.textContent = matches.length ? `${matches.length} customer account${matches.length === 1 ? '' : 's'} shown.` : 'No matching customer accounts.';
      for (const customer of matches) {
        const section = node('section', undefined, 'customer');
        const heading = node('div', undefined, 'customer-head');
        heading.append(node('h2', customer.name || '(name not set)'), node('span', customer.email, 'muted'));
        section.append(heading, node('p', `Customer since ${date(customer.created_at)} · Last sign-in ${date(customer.last_login_at)}`, 'muted'));
        if (customer.events.length) customer.events.forEach(event => section.append(renderEvent(event)));
        else section.append(node('p', 'No events created.', 'empty'));
        root.append(section);
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch('/api/owner/overview', { credentials: 'same-origin', cache: 'no-store' });
        if (response.status === 401) { location.assign('/?signin=1'); return; }
        if (!response.ok) throw new Error(response.status === 404 ? 'Access denied.' : 'Could not load owner data.');
        const data = await response.json();
        customers = data.customers;
        renderSummary(data.summary);
        renderCustomers();
      } catch (error) {
        status.textContent = error.message;
      }
    }

    search.addEventListener('input', renderCustomers);
    document.getElementById('signout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: { 'X-Requested-With': 'urlovingly' }
      });
      location.assign('/');
    });
    loadDashboard();
  </script>
</body>
</html>
